<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Judgement</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background-color: #F5F1E8;
    color: #333;
}

/* Navigation */

nav {
    background-color: #6B4F3A;
    padding: 15px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    padding: 6px 10px;
}

nav a:hover {
    color: #D8C3A5;
}

/* Hero */

.hero {
    min-height: 90vh;
    background:
        linear-gradient(
            rgba(60,40,20,.45),
            rgba(60,40,20,.65)
        ),
        url('image.png');

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
}

.hero-content {
    max-width: 850px;
    padding: 20px;
}

.hero h1 {
    font-size: 5rem;
    margin-bottom: 20px;
    letter-spacing: 2px;
}

.hero p {
    font-size: 1.4rem;
    line-height: 1.5;
}

/* Welcome */

.welcome {
    padding: 60px 20px;
    text-align: center;
    max-width: 900px;
    margin: auto;
}

.welcome h2 {
    margin-bottom: 20px;
    color: #6B4F3A;
    font-size: 2rem;
}

.welcome p {
    font-size: 1.1rem;
    line-height: 1.7;
}

/* Footer */

footer {
    background-color: #6B4F3A;
    color: white;
    text-align: center;
    padding: 25px;
}

footer h3 {
    margin-bottom: 10px;
}

/* Mobile & Tablet */

@media (max-width: 768px) {

    nav {
        gap: 6px;
        padding: 12px;
    }

    nav a {
        font-size: 0.9rem;
        padding: 4px 8px;
    }

    .hero {
        min-height: 70vh;
        padding: 20px;
    }

    .hero h1 {
        font-size: 2.5rem;
        line-height: 1.1;
        margin-bottom: 15px;
    }

    .hero p {
        font-size: 1rem;
    }

    .welcome {
        padding: 40px 15px;
    }

    .welcome h2 {
        font-size: 1.7rem;
    }

    .welcome p {
        font-size: 1rem;
    }

    footer {
        padding: 20px 15px;
    }
}

</style>

</head>
